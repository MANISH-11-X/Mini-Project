<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Food Manager</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-card">

        <h1>Create Account</h1>

        <form action="/register" method="post">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                name="name"
                id="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Create a password"
                required
            >


            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                id="confirm_password"
                placeholder="Confirm your password"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <p class="bottom-text">
            Already have an account?

            <a href="/login">
                Login
            </a>
        </p>

    </div>

</body>

</html>
